<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        div{
            border: 2px solid black;
            height: 300px;
            width: 300px;
            margin: 200px auto;
            box-shadow: 0px 0px 30px black;
        }
        img
        {
            height: inherit;
            width: inherit;
            transition: all ease-in-out 1s 0s;
        }
        img:hover
        {   
           transform: scale(1.8);
        }
    </style>
</head>
<body>
    <div>
        <img src="https://ritsin.com/wp-content/uploads/2016/02/Tirupati-Balaji-1.jpg"> 
    </div>
</body>
</html>
